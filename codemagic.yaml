workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd expense_pro && flutter packages pub get
      - name: Flutter build (no code sign)
        script: |
          cd expense_pro && flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          cd expense_pro
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r app-unsigned.ipa Payload
    artifacts:
      - expense_pro/app-unsigned.ipa

  android-release:
    name: Android Release Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          cd expense_pro && flutter packages pub get
      - name: Build Android APK
        script: |
          cd expense_pro && flutter build apk --release
    artifacts:
      - expense_pro/build/app/outputs/flutter-apk/app-release.apk
